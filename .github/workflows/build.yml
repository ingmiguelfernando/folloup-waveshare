name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          command: idf.py build && xs vuils && esptool.py --chip esp32s3 merge_bin -o followup-waveshare.bin @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/followup-waveshare.bin
