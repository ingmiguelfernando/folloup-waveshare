name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          command: curl -sSL -o sdkconfig https://raw.githubusercontent.com/alxv2016/folloup-sticky/896b393e504027de0a0bb44e5417715925bccf7f/sdkconfig && idf.py build && cd build && python -m esptool --chip esp32s3 merge_bin -o followup-waveshare.bin @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/followup-waveshare.bin
