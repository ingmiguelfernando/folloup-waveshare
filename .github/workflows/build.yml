name: build
on:
  push:
    branches: [folloup-waveshare]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          # sdkconfig.waveshare is the author's known-working config; sdkconfig.defaults alone boot-loops (ESP_ERR_NO_MEM).
          command: cp sdkconfig.waveshare sdkconfig && idf.py build && idf.py size > build/size.txt && cd build && python -m esptool --chip esp32s3 merge_bin -o followup-waveshare.bin @flash_args
      - name: Memory report
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat build/size.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          # The .elf is needed to decode panic backtraces.
          path: |
            build/followup-waveshare.bin
            build/*.elf
